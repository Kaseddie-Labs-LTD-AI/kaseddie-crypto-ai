<head>
    <meta charset="UTF-8">

    <title>Kaseddie AI  - Intelligent Asset Trading on Starknet</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Starknet.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/starknet@5.24.3/dist/index.min.js"></script>

    <style>
        :root {
            --primary-color: #00d4ff;
            --secondary-color: #ff6b35;
            --accent-color: #00ff88;
            --gold-color: #FFD700;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #888888;
        }

        /* --- NEW PROTOTYPE NOTICE --- */
        .prototype-notice {
            background: linear-gradient(135deg, var(--secondary-color), var(--gold-color));
            color: var(--dark-bg);
            text-align: center;
            padding: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 9999;
        }
        .prototype-notice a {
            color: var(--dark-bg);
            font-weight: 700;
            text-decoration: underline;
        }
        /* Adjust header padding to not be hidden by notice */
        header { padding-top: 45px; }


        html, body {
            margin: 0; padding: 0; width: 100%;
            overflow-x: hidden; font-family: 'Inter', sans-serif;
            background: var(--dark-bg); color: var(--text-primary);
            scroll-behavior: smooth;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(15px);
            z-index: 1000; border-bottom: 1px solid var(--card-border);
        }

        nav { display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--primary-color); }
        .nav-links { display: flex; gap: 30px; }
        .nav-link {
            color: var(--text-secondary); text-decoration: none; font-weight: 500;
            transition: color 0.3s ease; position: relative; padding: 5px 0;
        }
        .nav-link:hover, .nav-link.active { color: var(--primary-color); }
        .nav-link::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px;
            background: var(--primary-color); transition: width 0.3s ease;
        }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .connect-wallet-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white; border: none; padding: 10px 20px; border-radius: 20px;
            cursor: pointer; font-weight: 600; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.2);
        }
        .connect-wallet-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4); }
        #wallet-info {
            display: none; align-items: center; gap: 10px; background: var(--card-bg);
            padding: 8px 15px; border-radius: 20px; border: 1px solid var(--card-border);
        }
        #wallet-address { font-weight: 600; font-size: 0.9rem; }
        #disconnect-btn { background: none; border: none; color: var(--secondary-color); cursor: pointer; font-size: 1rem; }

        #home {
            padding-top: 150px; padding-bottom: 80px; text-align: center;
            min-height: 90vh; display: flex; flex-direction: column;
            justify-content: center; position: relative; overflow: hidden;
        }
        #home::before, #home::after {
            content: ''; position: absolute; width: 50vmax; height: 50vmax;
            border-radius: 50%; filter: blur(150px); z-index: -1; opacity: 0.15;
        }
        #home::before { background: var(--primary-color); top: -25vmax; left: -25vmax; }
        #home::after { background: var(--secondary-color); bottom: -25vmax; right: -25vmax; }

        h1 {
            font-size: 3.8rem; font-weight: 900; margin-bottom: 20px; line-height: 1.2;
            background: linear-gradient(135deg, var(--primary-color) 0%, #fff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-subtitle { font-size: 1.2rem; max-width: 700px; margin: 0 auto 40px; color: var(--text-secondary); }
        .starknet-badge {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--primary-color); padding: 8px 15px; border-radius: 20px;
            font-size: 0.9rem; font-weight: 500; margin-top: 20px;
        }
        .starknet-badge img { width: 20px; height: 20px; }

</head>
